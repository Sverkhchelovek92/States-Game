<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>States</title>
  </head>
  <body>
    <div id="city-panel" class="city-panel hidden">
      <div class="city-panel-header">
        <span id="city-name">City</span>
        <button id="city-close">×</button>
      </div>

      <div class="city-panel-content">
        <div>Population: <span id="city-population">1</span></div>
        <div>Health: <span id="city-health">100 / 100</span></div>
        <div>Owner: <span id="city-owner">1</span></div>
        <div class="city-production">
          <div>Production: <span id="city-production-item">None</span></div>
          <div>Progress: <span id="city-production-progress">0 / 0</span></div>
          <div>
            <button id="produce-warrior">Warrior</button>
            <button id="produce-settler">Settler</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
